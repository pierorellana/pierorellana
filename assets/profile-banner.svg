<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="Pierre Orellana, Ingeniero de Software y Desarrollador Mobile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090C"/>
      <stop offset="48%" stop-color="#0A1013"/>
      <stop offset="100%" stop-color="#102326"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ED7D4"/>
      <stop offset="100%" stop-color="#B7E6E5"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5ED7D4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#5ED7D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#21454A" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="430" rx="28" fill="url(#grid)" opacity="0.42"/>
  <ellipse cx="1065" cy="150" rx="300" ry="240" fill="url(#halo)"/>

  <g opacity="0.42">
